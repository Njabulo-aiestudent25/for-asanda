<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For uNtombi Zwane</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{
font-family:Arial, sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(
135deg,
#ff9a9e,
#fad0c4,
#ffd1ff
);

overflow:hidden;
}

/* Floating hearts */

.hearts{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
pointer-events:none;
overflow:hidden;
}
.heart{
position:absolute;
color:white;
font-size:20px;
animation:float 10s linear infinite;
opacity:0.7;
}
@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}

 

10%{
61
opacity:1;

}

 

100%{

transform:translateY(-120vh);

opacity:0;

}

}

 

/* Main Card */

.container{

width:90%;

max-width:650px;

background:rgba(255,255,255,0.25);

backdrop-filter:blur(12px);

padding:35px;

border-radius:30px;

box-shadow:

0 8px 40px rgba(0,0,0,0.2);

text-align:center;

z-index:1;

}

.image-container img{

width:280px;

max-width:100%;

border-radius:20px;

box-shadow:0 8px 25px rgba(0,0,0,0.2);

margin-bottom:20px;

}

h1{

color:#b91d73;

font-size:2.4rem;

margin-bottom:20px;

line-height:1.3;

text-shadow:

2px 2px 10px rgba(255,255,255,0.5);

}

.message-text{

display:none;

margin-top:20px;

font-size:1.15rem;

line-height:1.7;

color:#444;

background:rgba(255,255,255,0.5);

padding:20px;

border-radius:20px;

}

.buttons{

margin-top:30px;

display:flex;

justify-content:center;

align-items:center;

gap:20px;

}

button{

border:none;

border-radius:50px;

padding:15px 30px;

cursor:pointer;

font-size:1.2rem;

font-weight:bold;

transition:all 0.3s ease;

}

#yesBtn{

background:#4CAF50;

color:white;

}

#yesBtn:hover{

background:#3f9f44;

}

#noBtn{
background:#ff4d6d;

color:white;

}

#noBtn:hover{

background:#e6395d;

}

</style>

</head>

<body>

<div class="hearts">

<span class="heart" style="left:10%;">❤️</span>

<span class="heart" style="left:25%; animation-delay:2s;">💖</span>

<span class="heart" style="left:40%; animation-delay:4s;">💕</span>
<span class="heart" style="left:60%; animation-delay:1s;">❤️</span>

<span class="heart" style="left:75%; animation-delay:5s;">💗</span>

<span class="heart" style="left:90%; animation-delay:3s;">💞</span>

</div>

<div class="container">

<div class="image-container">
    
 <img src="Image.jpg" alt="Image">

 
</div>

<h1 id="question">

Asanda, is your boyfriend the funniest person? 🤔

</h1>

<p id="sweetMessage" class="message-text">

My love, it is okay to not be okay. ❤️

<br><br>


The only thing this annoying guy wants, is to see you happy.

Please never stop being the Limelight in our lives.


</p>

<div class="buttons">

<button id="yesBtn" onclick="selectYes()">Yes 😍</button>

<button id="noBtn" onclick="growYesButton()">No 😒</button>

</div>


</div>

<script>

let scale = 1;
const noPhrases = [
"Are you sure? 🥺",
"Think again 💔",
"Wrong answer 😭",
"Try again 😂",
"Be honest 😏",
"Yes is better 👀",
"Come on now 🤨",
"Don't lie 😂",
"Last chance 😭",
"Seriously? 🤔"

];
let phraseIndex = 0;

function growYesButton(){

scale += 0.3;

const yesBtn =
document.getElementById("yesBtn");

yesBtn.style.transform =
`scale(${scale})`;

const noBtn =
document.getElementById("noBtn");

noBtn.innerText =
noPhrases[phraseIndex];

phraseIndex =

(phraseIndex + 1)
% noPhrases.length;
}
function selectYes() {

document.querySelector(".container").innerHTML = `

<div class="image-container">

<img src="Image.jpg" alt="Our Photo"

style="
width:300px;

max-width:100%;

border-radius:20px;

box-shadow:0 8px 25px rgba(0,0,0,0.2);

">

</div>

<h1 style="

color:#b91d73;

margin-top:20px;

">

💖 For Asanda 💖

</h1>

<p style="

font-size:1.3rem;

line-height:1.8;
color:#444;

background:rgba(255,255,255,0.75);

padding:25px;

border-radius:20px;

margin-top:20px;

">

My love, it is okay to not be okay. ❤️

<br><br>

The only thing that this annoying guy wants is to see you happy.
<br><br>

Please never stop being the limelight in our lives.

<br><br>

You make every day brighter, every laugh louder, and every moment more special.

<br><br>

I love you more than words can explain. 🥰❤️

i had to make it corny, Sifisaukubonga.

</p>

`;

}
</script>
</body>
</html>
